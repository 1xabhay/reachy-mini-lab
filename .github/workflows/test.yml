# The Sage voice app's and the simulator's tests: no robot, no GPU, no models.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sage-voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reachy_sage_voice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q

  reachy-sim:
    runs-on: ubuntu-latest
    # The device tests run sage-kernel's conformance kernel from a sibling checkout.
    defaults:
      run:
        working-directory: lab/apps/reachy_sim
    env:
      MUJOCO_GL: osmesa # offscreen eye-camera renders on a runner with no GPU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lab
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 1xabhay/sage-kernel
          ref: v0.1.0
          path: sage-kernel
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
