[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-testbench"
version = "0.1.0"
description = "Debug & CI testbench for Reachy Mini: calibration, diagnostics and validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reachy-mini>=1.10.0",
    "numpy>=2.2.5",
    "opencv-python<=5.0",
    "soundfile",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
reachy_mini_testbench = "reachy_mini_testbench.main:TestbenchApp"

[project.scripts]
reachy-diag = "reachy_mini_testbench.diagnostics:main"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_mini_testbench = ["**/*"]
